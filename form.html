<!DOCTYPE html>
<html lang="en">
   
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form - Google Forms Style</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
   <style>
     fieldset
     {
      justify-content: flex-start;
      align-content: center;
     }
   </style>
</head>
<body>
<div class="form-container">
<h2 class="form-title">REGISTRATION</h2>
 <form action="submission_success.html" method="GET" class="google-form">
 <fieldset class="form-section">
<legend class="section-title">Personal Information</legend>
<div class="form-group">
    <label for="fullName">Full Name:</label>
  <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
 </div>
<div class="form-group">
  <label for="email">Email Address:</label>
  <input type="email" id="email" name="email" placeholder="Enter your email" required>
</div>
 <div class="form-group">
  <label for="password">Password:</label>
  <input type="password" id="password" name="password" placeholder="At least 6 characters" minlength="6" required>
 </div>
  <div class="form-group">
<label for="confirmPassword">Confirm Password:</label>
 <input type="password" id="confirmPassword" name="confirmPassword" required>
  </div>
<div class="form-group">
<label class="block-label">Gender:</label>
<div class="radio-group">
<input type="radio" id="male" name="gender" value="male">
 <label for="male">Male</label>
 <input type="radio" id="female" name="gender" value="female">
  <label for="female">Female</label>
 </div>
 </div>
 <div class="form-group">
 <label class="block-label">Hobbies:</label>
 <div class="checkbox-group">
 <input type="checkbox" id="reading" name="hobbies" value="reading">
<label for="reading">Reading</label>
 <input type="checkbox" id="traveling" name="hobbies" value="traveling">
 <label for="traveling">Traveling</label>
 <input type="checkbox" id="gaming" name="hobbies" value="gaming">
 <label for="gaming">Gaming</label>
  </div>
 </div>
 <div class="form-group">
   <label for="dob">Date of Birth:</label>
 <input type="date" id="dob" name="dob">
 </div>
<div class="form-group">
 <label for="profilePicture">Upload Profile Picture:</label>
 <input type="file" id="profilePicture" name="profilePicture">
  </div>
  </fieldset>
 <fieldset class="form-section">
 <legend class="section-title">Additional Information</legend>
<div class="form-group">
<label for="country">Country:</label>
<select id="country" name="country">
<option value="">--Select--</option>
<option value="usa">United States</option>
<option value="can">Japan</option> 
<option value="uk">Switzerland</option>
 <option value="ind">India</option>
 </select>
 </div>
 <div class="form-group">
 <label for="comments">Comments:</label>
<textarea id="comments" name="comments" rows="4" placeholder=" "></textarea>
 </div>
 </fieldset>
 <div class="form-actions">
<input type="submit" value="Register" class="submit-button">
<input type="reset" value="Clear" class="reset-button">
 </div>
 </form>
 </div>

</body>
</html>
